name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore HoldKeyPlugin.sln
      - run: dotnet format HoldKeyPlugin.sln --verify-no-changes --no-restore
      - run: dotnet test HoldKeyPlugin.sln --configuration Release --no-restore
      - run: dotnet build HoldKeyPlugin/HoldKeyPlugin.csproj --configuration Release --no-restore
